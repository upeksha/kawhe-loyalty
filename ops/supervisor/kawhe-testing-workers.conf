; Testing only. Keep emails independent of slow/retrying Wallet jobs on default.
[program:kawhe-testing-queue]
directory=/var/www/kawhe-testing
command=/usr/bin/php -d memory_limit=96M artisan queue:work database --queue=default --sleep=1 --tries=3 --timeout=70 --memory=80 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/kawhe-testing-queue.log
stopwaitsecs=90

[program:kawhe-testing-emails]
directory=/var/www/kawhe-testing
command=/usr/bin/php -d memory_limit=96M artisan queue:work database --queue=emails --sleep=1 --tries=3 --timeout=60 --memory=80 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/kawhe-testing-emails.log
stopwaitsecs=90
