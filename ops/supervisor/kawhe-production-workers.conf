; PREPARED ONLY. Replace the existing kawhe-queue definition, do not append it.
; Disable the legacy kawhe-queue.service during the approved maintenance window.
[program:kawhe-queue]
directory=/var/www/kawhe
command=/usr/bin/php -d memory_limit=96M artisan queue:work database --queue=default --sleep=1 --tries=3 --timeout=70 --memory=80 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/kawhe-queue.log
stopwaitsecs=90

[program:kawhe-emails]
directory=/var/www/kawhe
command=/usr/bin/php -d memory_limit=96M artisan queue:work database --queue=emails --sleep=1 --tries=3 --timeout=60 --memory=80 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/kawhe-emails.log
stopwaitsecs=90
